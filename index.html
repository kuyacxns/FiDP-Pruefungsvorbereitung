// =============================================================
// PERSISTENT STORAGE - localStorage version
// =============================================================

const STORAGE_KEY = 'fidp_progress_v1';

const defaultProgress = {
  completedTopics: {},
  quizAnswers: {},
  studyStreakDays: 0,
  lastStudyDate: null,
  totalQuizzesPassed: 0,
};

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress;
    return { ...defaultProgress, ...JSON.parse(raw) };
  } catch {
    return defaultProgress;
  }
}

function saveProgress(p) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  } catch (e) {
    console.error('Storage error', e);
  }
}

function useProgress() {
  const [progress, setProgress] = useState(loadProgress);

  const save = (next) => {
    setProgress(next);
    saveProgress(next);
  };

  const reset = () => {
    setProgress(defaultProgress);
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  };

  return { progress, save, reset };
}

const ICONS = {
  briefcase: Briefcase,
  chart: BarChart3,
  network: Network,
  database: Database,
  shield: Shield,
  settings: Settings,
  book: BookOpen,
  fileText: FileText,

};

function TopicIcon({ name, className = 'w-5 h-5' }) {
  const Icon = ICONS[name] || BookOpen;
  return <Icon className={className} />;
}

function ProgressBar({ value, max = 100, className = '' }) {
  const pct = Math.min(100, Math.max(0, (value / max) * 100));
  return (
    <div className={`h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden ${className}`}>
      <div
        className="h-full bg-gradient-to-r from-cyan-400 to-cyan-300 transition-all duration-700 rounded-full"
        style={{ width: `${pct}%` }}
      />
    </div>
  );
}

function Quiz({ topic, progress, save }) {
  const stored = progress.quizAnswers[topic.id] || {};
  const [answers, setAnswers] = useState(stored);
  const [submitted, setSubmitted] = useState(Object.keys(stored).length === topic.quiz.length);

  useEffect(() => {
    const s = progress.quizAnswers[topic.id] || {};
    setAnswers(s);
    setSubmitted(Object.keys(s).length === topic.quiz.length);
  }, [topic.id]);

  const handleSelect = (qIdx, optIdx) => {
    if (submitted) return;
    setAnswers((prev) => ({ ...prev, [qIdx]: optIdx }));
  };

  const handleSubmit = () => {
    if (Object.keys(answers).length !== topic.quiz.length) return;
    setSubmitted(true);
    const correctCount = topic.quiz.reduce(
      (acc, q, i) => acc + (answers[i] === q.correct ? 1 : 0), 0
    );
    save({
      ...progress,
      quizAnswers: { ...progress.quizAnswers, [topic.id]: answers },
      completedTopics: {
        ...progress.completedTopics,
        [topic.id]: {
          correctCount,
          totalQuestions: topic.quiz.length,
          completed: correctCount === topic.quiz.length,
        },
      },
      totalQuizzesPassed: progress.totalQuizzesPassed + (correctCount === topic.quiz.length ? 1 : 0),
      lastStudyDate: new Date().toISOString(),
    });
  };

  const handleRetry = () => {
    setAnswers({});
    setSubmitted(false);
    save({
      ...progress,
      quizAnswers: { ...progress.quizAnswers, [topic.id]: {} },
      completedTopics: { ...progress.completedTopics, [topic.id]: undefined },
    });
  };

  const correctCount = topic.quiz.reduce(
    (acc, q, i) => acc + (answers[i] === q.correct ? 1 : 0), 0
  );

  return (
    <div className="space-y-6">
      {topic.quiz.map((q, qIdx) => {
        const selected = answers[qIdx];
        return (
          <div key={qIdx} className="border border-zinc-800 rounded-lg p-4 sm:p-5 bg-zinc-950/50">
            <div className="flex items-start gap-3 mb-4">
              <span className="text-cyan-400 font-mono text-sm pt-0.5">{String(qIdx + 1).padStart(2, '0')}</span>
              <p className="text-zinc-100 leading-relaxed font-medium flex-1">{q.q}</p>
            </div>
            <div className="space-y-2 sm:ml-8">
              {q.options.map((opt, optIdx) => {
                const isSelected = selected === optIdx;
                const isCorrect = optIdx === q.correct;
                let style = 'border-zinc-800 hover:border-zinc-600 hover:bg-zinc-900/50 cursor-pointer';
                if (submitted) {
                  if (isCorrect) style = 'border-emerald-700 bg-emerald-950/40 text-emerald-100';
                  else if (isSelected) style = 'border-red-700 bg-red-950/40 text-red-100';
                  else style = 'border-zinc-800 text-zinc-500';
                } else if (isSelected) {
                  style = 'border-cyan-500 bg-cyan-950/30 text-cyan-100';
                }
                return (
                  <button
                    key={optIdx}
                    onClick={() => handleSelect(qIdx, optIdx)}
                    disabled={submitted}
                    className={`w-full text-left px-3 sm:px-4 py-2.5 border rounded transition-all duration-200 flex items-center gap-3 ${style}`}
                  >
                    <span className="font-mono text-xs opacity-60 w-4">{String.fromCharCode(65 + optIdx)}</span>
                    <span className="flex-1 text-sm">{opt}</span>
                    {submitted && isCorrect && <Check className="w-4 h-4 text-emerald-400 flex-shrink-0" />}
                    {submitted && isSelected && !isCorrect && <X className="w-4 h-4 text-red-400 flex-shrink-0" />}
                  </button>
                );
              })}
            </div>
            {submitted && (
              <div className="mt-4 sm:ml-8 p-3 bg-zinc-900/80 border-l-2 border-cyan-500 rounded-r">
                <div className="flex gap-2 text-xs text-cyan-400 font-mono mb-1 uppercase tracking-wider">
                  <Lightbulb className="w-3.5 h-3.5" /> Erklärung
                </div>
                <p className="text-sm text-zinc-300 leading-relaxed">{q.explanation}</p>
              </div>
            )}
          </div>
        );
      })}

      <div className="flex flex-wrap items-center gap-3 pt-2">
        {!submitted ? (
          <button
            onClick={handleSubmit}
            disabled={Object.keys(answers).length !== topic.quiz.length}
            className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 disabled:bg-zinc-800 disabled:text-zinc-500 text-zinc-950 font-medium rounded transition-colors text-sm tracking-wide"
          >
            Auswerten ({Object.keys(answers).length}/{topic.quiz.length})
          </button>
        ) : (
          <>
            <div className={`px-4 py-2 rounded text-sm font-medium ${
              correctCount === topic.quiz.length
                ? 'bg-emerald-950/50 text-emerald-300 border border-emerald-800'
                : 'bg-amber-950/50 text-amber-300 border border-amber-800'
            }`}>
              {correctCount} von {topic.quiz.length} richtig
              {correctCount === topic.quiz.length && ' – Thema gemeistert!'}
            </div>
            <button
              onClick={handleRetry}
              className="px-4 py-2 border border-zinc-700 hover:border-cyan-500 hover:text-cyan-300 text-zinc-400 text-sm rounded transition-colors flex items-center gap-2"
            >
              <RotateCcw className="w-3.5 h-3.5" /> Erneut versuchen
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function TopicCard({ topic, progress, save, expanded, onToggle }) {
  const status = progress.completedTopics[topic.id];
  const isCompleted = status?.completed;
  const isAttempted = !!status;

  return (
    <div className={`border rounded-lg overflow-hidden transition-all ${
      isCompleted ? 'border-emerald-800/60 bg-emerald-950/10'
        : isAttempted ? 'border-amber-800/40 bg-zinc-950/50'
        : 'border-zinc-800 bg-zinc-950/50 hover:border-zinc-700'
    }`}>
      <button
        onClick={onToggle}
        className="w-full text-left p-4 sm:p-5 flex items-start gap-3 sm:gap-4 hover:bg-zinc-900/30 transition-colors"
      >
        <div className={`p-2 rounded-md flex-shrink-0 mt-0.5 ${
          isCompleted ? 'bg-emerald-900/40 text-emerald-300' : 'bg-zinc-800/60 text-cyan-400'
        }`}>
          <TopicIcon name={topic.icon} className="w-4 h-4" />
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-1.5 flex-wrap">
            <h3 className="font-serif text-base sm:text-lg text-zinc-100">{topic.title}</h3>
            {isCompleted && (

    </div>

}

function Dashboard({ progress, reset, totalTopics, onJumpTo }) {
  const completed = Object.values(progress.completedTopics).filter(t => t?.completed).length;
  const attempted = Object.values(progress.completedTopics).filter(t => t).length;
  const totalPoints = Object.values(progress.completedTopics).reduce(
    (a, b) => a + (b?.correctCount || 0), 0
  );
  const totalQuestions = Object.values(progress.completedTopics).reduce(
    (a, b) => a + (b?.totalQuestions || 0), 0
  );
  const accuracy = totalQuestions > 0 ? Math.round((totalPoints / totalQuestions) * 100) : 0;

  const stats = [
    { label: 'Themen gemeistert', value: `${completed} / ${totalTopics}`, icon: Trophy, color: 'text-emerald-400' },
    { label: 'Themen begonnen', value: attempted, icon: Target, color: 'text-cyan-400' },
    { label: 'Trefferquote', value: `${accuracy}%`, icon: Zap, color: 'text-amber-400' },
    { label: 'Quizzes bestanden', value: progress.totalQuizzesPassed, icon: Award, color: 'text-fuchsia-400' },

            <h3 className="font-serif text-lg sm:text-xl text-zinc-100 mb-4 flex items-center gap-2">
              <span className="text-cyan-400 font-mono text-sm">§</span> {grp.title}
            </h3>
            <div className="grid md:grid-cols-2 gap-3">
              {grp.items.map((r) => (
                <a
                  key={r.name}
                  href={r.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="border border-zinc-800 hover:border-cyan-700 bg-zinc-950/50 hover:bg-zinc-900/50 rounded-lg p-4 transition-all group"
                >
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <h4 className="font-medium text-zinc-100 group-hover:text-cyan-300 transition-colors text-sm leading-snug">
                      {r.name}
                    </h4>
                    <ExternalLink className="w-3.5 h-3.5 text-zinc-600 group-hover:text-cyan-400 flex-shrink-0 mt-0.5" />
                  </div>
                  <p className="text-xs text-zinc-400 leading-relaxed">{r.desc}</p>
                </a>
              ))}
            </div>
          </section>
        ))}
      </div>
    </div>
  );
}
